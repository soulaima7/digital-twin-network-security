#!/usr/sbin/nft -f
# =====================================================================
#  Scenario DURCI : politique "deny all" par defaut
#  Interfaces du pare-feu :
#    eth0     = gestion (172.20.20.0/24)
#    eth1.10  = LAN  (VLAN 10, 10.10.10.0/24)
#    eth1.20  = DMZ  (VLAN 20, 10.10.20.0/24)
#    eth2     = ATK  (WAN,     10.10.30.0/24)
# =====================================================================
flush ruleset

define LAN_IF = "eth1.10"
define DMZ_IF = "eth1.20"
define ATK_IF = "eth2"
define WEB    = 10.10.20.10

table inet filter {
    # IP bannies automatiquement (rempli par autoban.py en semaine 3)
    set banned {
        type ipv4_addr
        flags timeout
    }

    # ---- Trafic a destination du pare-feu lui-meme ----
    chain input {
        type filter hook input priority 0; policy drop;
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        iifname "eth0" tcp dport 9100 accept              # supervision (node_exporter)
        iifname $LAN_IF icmp type echo-request accept     # ping de la passerelle depuis le LAN
        iifname $DMZ_IF icmp type echo-request accept
    }

    # ---- Trafic route entre les zones ----
    chain forward {
        type filter hook forward priority 0; policy drop;
        ip saddr @banned drop                              # 1. IP bannies
        ct state established,related accept               # 2. retours autorises
        ct state invalid drop
        iifname $LAN_IF accept                             # 3. LAN -> toutes zones
        iifname $ATK_IF oifname $DMZ_IF ip daddr $WEB \
            tcp dport { 22, 80, 443 } accept               # 4. ATK -> services publies
        # 5. tout le reste (DMZ -> LAN, ATK -> LAN, ...) : policy drop
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
