# =====================================================================
#  Scenario DURCI - nginx durci
#    - server_tokens off : version de nginx masquee (en-tete + erreurs)
#    - HTTPS avec certificat auto-signe (TLS 1.2+/1.3 uniquement)
#    - Le port 80 reste ouvert et redirige vers 443 (le pare-feu durci
#      autorise deja les deux ports vers 10.10.20.10)
# =====================================================================
user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server_tokens off;

    server {
        listen 80 default_server;
        server_name web.twin.local 10.10.20.10;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        server_name web.twin.local 10.10.20.10;

        ssl_certificate     /etc/nginx/ssl/web.crt;
        ssl_certificate_key /etc/nginx/ssl/web.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        root /var/www/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
