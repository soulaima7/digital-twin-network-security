# =====================================================================
#  Scenario BASELINE - nginx en configuration par defaut
#  (server_tokens on, HTTP seul, pas de TLS) : volontairement faible.
# =====================================================================
user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # server_tokens reste "on" (valeur par defaut) : la version de nginx
    # est visible dans l'en-tete Server et les pages d'erreur.

    server {
        listen 80 default_server;
        server_name web.twin.local 10.10.20.10;
        root /var/www/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
