#!/usr/sbin/nft -f
# =====================================================================
#  Scenario BASELINE : reseau plat, aucun filtrage (volontairement faible)
# =====================================================================
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy accept;
    }
    chain forward {
        type filter hook forward priority 0; policy accept;   # tout passe
    }
    chain output {
        type filter hook output priority 0; policy accept;
    }
}
